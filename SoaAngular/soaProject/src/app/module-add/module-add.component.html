<section class="module-add-card">
  <div class="module-add-head">
    <div>
      <p class="card-label">Ajouter un module</p>
      <h2>Créer un nouveau module</h2>
    </div>
  </div>

  <form class="module-add-form" (ngSubmit)="addModule()">
    <div class="form-row">
      <label>Matricule</label>
      <input type="text" [(ngModel)]="newModule.matricule" name="matricule" required />
    </div>

    <div class="form-row">
      <label>Nom</label>
      <input type="text" [(ngModel)]="newModule.nom" name="nom" required />
    </div>

    <div class="form-row two-columns">
      <div>
        <label>Coefficient</label>
        <input type="number" [(ngModel)]="newModule.coefficient" name="coefficient" required min="1" />
      </div>
      <div>
        <label>Volume horaire</label>
        <input type="number" [(ngModel)]="newModule.volumeHoraire" name="volumeHoraire" required min="1" />
      </div>
    </div>

    <div class="form-row">
      <label>Type</label>
      <select [(ngModel)]="newModule.type" name="type" required>
        <option *ngFor="let type of types" [value]="type">{{ type }}</option>
      </select>
    </div>

    <div class="form-row">
      <label>Unité d’enseignement</label>
      <select [(ngModel)]="newModule.uniteEnseignement" name="uniteEnseignement" required>
        <option [ngValue]="undefined" disabled selected>Choisir une UE</option>
        <option *ngFor="let ue of ues" [ngValue]="ue">{{ ue.code }} - {{ ue.domaine }}</option>
      </select>
    </div>

    <div class="form-actions">
      <button type="submit" [disabled]="isSubmitting" class="save-button">
        {{ isSubmitting ? 'Ajout en cours...' : 'Ajouter le module' }}
      </button>
    </div>

    <div *ngIf="error" class="form-error">{{ error }}</div>
  </form>
</section>
